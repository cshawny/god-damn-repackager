plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21+, so target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = neo_version

    // Generate neoforge.mods.toml from the template in src/main/templates/ (handles ${...} substitution).
    // NeoForge discovers mixin configs via [[mixins]] entries in neoforge.mods.toml — the old ForgeGradle
    // `mixin {}` block + MixinGradle plugin + `MixinConfigs` jar manifest attribute are ALL obsolete on
    // NeoForge (see TECHNICAL.md §3.1). Mixin is bundled into NeoForge itself; no extra Gradle plugin needed.

    parchment {
        // Parchment adds parameter names on top of the official mappings.
        minecraftVersion = minecraft_version
        mappingsVersion = "2024.11.17"
    }

    runs {
        configureEach {
            // Recommended logging level for the console
            systemProperty 'neoforge.logging.console.level', 'info'
            systemProperty 'neoforge.logging.markers', ''

            // Make our own mod's sources available to the run
            mods {
                "${mod_id}" {
                    sourceSet sourceSets.main
                }
            }
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Create, Ponder, Flywheel (Create's maven; Create publishes non-release builds with build numbers here)
    maven {
        name = "Create Maven"
        url = "https://maven.createmod.net"
    }
    // Registrate mirror (1.21 line)
    maven {
        name = "Registrate Mirror"
        url = "https://maven.ithundxr.dev/snapshots"
    }
    // ForgeConfigAPIPort (transitive dep of some Create deps)
    maven {
        name = "ForgeConfigAPIPort"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    // JEI
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    // Create 6.0.10 (build 289) dev-environment dependency.
    // Per official Create wiki ("Depend on Create", NeoForge 1.21.1).
    // :slim + explicit Ponder/Flywheel/Vanillin makes the Mixin refmaps remap correctly
    // in the dev environment (mirrors how Create itself pulls its own deps).
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    // Vanillin: Flywheel's UI layer, split out as a separate dep on 1.21.1. Required at runtime by Create.
    runtimeOnly("dev.engine-room.vanillin:vanillin-neoforge-${minecraft_version}:${vanillin_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // JEI — needed to issue crafting orders in-game (the only way to send a bulk crafting request).
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
}

// === neoforge.mods.toml template expansion ===
// ModDevGradle doesn't auto-process src/main/templates/ unless we wire it up (Create uses a custom
// generateModMetadata task). We replicate that here: substitute ${...} from gradle.properties and
// emit the file into build/generated/sources/modMetadata/, then add it to resources.
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            mod_id          : mod_id,
            mod_name        : mod_name,
            mod_version     : mod_version,
            mod_authors     : mod_authors,
            mod_description : mod_description,
            mod_license     : mod_license,
            neo_version_range: neo_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

// Also expand pack.mcmeta's ${mod_id} reference.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id: mod_id,
    ]
    inputs.properties replaceProperties
    filesMatching('pack.mcmeta') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    // Alpha-stage marker: append "-alpha" to the artifact name so the pre-release status is
    // visible in the filename (e.g. goddamnrepackager-0.4.0-neoforge-alpha.jar). Controlled by
    // the mod_is_alpha flag in gradle.properties. See TECHNICAL.md §5.
    if (project.hasProperty('mod_is_alpha') && project.property('mod_is_alpha').toBoolean()) {
        archiveClassifier = 'alpha'
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

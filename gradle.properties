# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Gradle itself must be launched with a JDK 21+ (see g.sh wrapper, which points at JDK 22).
# ModDevGradle resolves the Java 21 toolchain automatically for compiling our code.
org.gradle.java.installations.fromCurrent=true


## Environment Properties

# The Minecraft version must agree with the NeoForge version to get a valid artifact
minecraft_version=1.21.1
# Minecraft version range for the mod's minecraft dependency (NeoForge convention: exact patch pin)
minecraft_version_range=[1.21.1]
# NeoForge version for MC 1.21.1 (matches Create 6.0.10-281 dev dependency).
neo_version=21.1.219
# FML language-loader version range. NeoForge's javafml loader reports version 4.x at runtime,
# so a loose lower bound matches. (Using the NeoForge version here breaks language-provider resolution.)
loader_version_range=[1,)


## Mod Properties

mod_id=goddamnrepackager
mod_name=God Damn Repackager
mod_license=MIT
mod_version=0.4.0-neoforge
# When true, the built jar gets an "-alpha" classifier (e.g. goddamnrepackager-0.4.0-neoforge-alpha.jar)
# to make the pre-release/testing status visible in the filename. Set to false once the mod
# reaches a stable release. See TECHNICAL.md §5.
mod_is_alpha=true
mod_group_id=com.github.goddamnrepackager
mod_authors=cshaw
mod_description=Parallel repackaging for Create 6.0+. When you place a large crafting order through the Stockkeeper, all Repackagers attached to the same input vault now share the work instead of leaving it all to one. N repackagers = up to Nx faster order fulfillment.

# Create 6.0.10 dev-environment dependency versions (per Create wiki "Depend on Create" NeoForge 1.21.1).
# create_version build number 281 = the maven build that exactly corresponds to the 6.0.10 release jar.
# (Modrinth/CurseForge publish release jars without build numbers; the maven publishes CI builds with
# build numbers. The wiki documents which build number matches a given release.)
create_version=6.0.10-281
ponder_version=1.0.82
flywheel_version=1.0.6
vanillin_version=1.1.3-41
registrate_version=MC1.21-1.3.0+67
# JEI for issuing crafting orders in-game (MC 1.21.1 = JEI 19.x)
jei_version=19.21.0.247

modLoader="javafml"
loaderVersion="${neo_version_range}"
license="${mod_license}"

# NeoForge mixin registration. NeoForge no longer reads the old `MixinConfigs` jar
# manifest attribute; instead it discovers mixin configs via [[mixins]] entries here.
# (See TECHNICAL.md §3.1 — the ForgeGradle/MixinGradle approach is fully obsolete on NeoForge.)
[[mixins]]
config="${mod_id}.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# We depend on Create (the mod we are patching)
[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange="[6.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoforge"
    mandatory=true
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="BOTH"

modLoader="javafml"
# loaderVersion is the FML *language loader* version range (NOT the NeoForge version).
# NeoForge's javafml loader reports version 4.x at runtime, so a loose lower bound matches.
# (Using the NeoForge version here caused "Missing language javafml version [21.1.219,)" errors.)
loaderVersion="${loader_version_range}"
license="${mod_license}"

# NeoForge mixin registration. NeoForge no longer reads the old `MixinConfigs` jar
# manifest attribute; instead it discovers mixin configs via [[mixins]] entries here.
# (See TECHNICAL.md §3.1 — the ForgeGradle/MixinGradle approach is fully obsolete on NeoForge.)
[[mixins]]
config="${mod_id}.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# We depend on Create (the mod we are patching)
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
